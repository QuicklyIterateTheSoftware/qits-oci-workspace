# The push pipeline: build the image and push it under the built sha.
#
# THE IMAGE NAME IS NOT THE REPOSITORY NAME. This publishes `qits/workspace-base`, because that is
# the name every consuming Dockerfile already writes — qits-workspace-daemon's
# docker/Dockerfile.workspace and the project-agent images take it as their base. Renaming it to
# match the repository would break them for nothing. The repository name is where the recipe lives;
# `qits/workspace-base` is what the recipe produces.
#
# ONE TAG PER PIPELINE. Do not add a second `-t` and a second push here. A sibling repository tried
# `docker build -t A -t B` then pushed both, and the second push failed with "tag does not exist":
# BuildKit's exporter does not reliably leave every alias of a multi-tag build in the local image
# store. Split the coordinates instead — this pipeline owns the sha, ci-event-release.yml owns the
# version.
#
# No `--network` flag: nothing in this build dials the platform. The base image is pulled through
# the OCI mirror by the daemon, not by the build.
#
# `set -eu` is load-bearing rather than tidy: the daemon runs the script with `bash -c` and no -e,
# so without it a failed build is swallowed by the next command's exit code — the push fails,
# `docker rmi || true` answers 0, and the run reports SUCCESS. The deployer is then told an image
# exists that does not. -u makes an unset registry variable stop the step too.
#
# The timeout is large on purpose. This is a ~3.4 GB image: two apt trees, a JDK, node + pnpm, a
# Playwright Chromium with its shared-library deps, two agent CLIs and jdtls, all fetched from the
# network. An hour is not enough headroom on a cold cache.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      set -eu
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base:$QITS_CI_SHA"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
